name: macOS build

# Builds a universal (Apple Silicon + Intel) .dmg and attaches it to the release.
# Runs when a release is published, or by hand for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to, e.g. v2.0.3"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build universal app
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      - name: Rename disk image
        id: dmg
        run: |
          src=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          version="${TAG#v}"
          out="stream-player-${version}-macos-universal.dmg"
          cp "$src" "$out"
          shasum -a 256 "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.dmg.outputs.file }}

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.dmg.outputs.file }}" --clobber --repo "$GITHUB_REPOSITORY"
